<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midah Asmiya – Behind The Scene 1</title>
<meta name="description" content="Midah Asmiya – Behind The Scene 1. Cerita berbeda, dari hati penulis untuk hati pembaca.">
<meta name="theme-color" content="#cfe8d8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#cfe8f0; --sky-mid:#eaf4e6; --sky-low:#fde9d8;
  --ink:#2c4636; --rose:#b8325a; --rose-deep:#8c1f43; --cream:#fffaf3;
  --glass:rgba(255,250,243,.72); --glass-line:rgba(255,255,255,.85);
  --shadow:0 18px 50px -18px rgba(44,70,54,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--sky-mid);min-height:100vh;overflow-x:hidden;line-height:1.4}

/* ===== Landscape background ===== */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 48%,var(--sky-low) 100%)}
.scene svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.layer{will-change:transform;transition:transform .25s ease-out}
.sun{position:absolute;top:9%;right:12%;width:clamp(90px,16vw,170px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6d8 0 38%,rgba(255,236,190,.65) 55%,rgba(255,236,190,0) 72%);animation:glow 7s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);opacity:.85}}
.cloud{position:absolute;width:var(--w);height:calc(var(--w)*.28);background:#fff;border-radius:999px;opacity:.75;filter:blur(1px);animation:drift var(--t) linear infinite;top:var(--y);left:-30%}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:38%;height:130%;left:18%;top:-55%}
.cloud::after{width:30%;height:110%;left:50%;top:-35%}
@keyframes drift{to{transform:translateX(160vw)}}
.petals{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-30px;width:var(--s);height:calc(var(--s)*1.3);background:linear-gradient(135deg,#ffd5de,#f4a3b8);border-radius:70% 0 70% 0;opacity:.85;animation:fall var(--d) linear var(--dl) infinite}
@keyframes fall{0%{transform:translate3d(0,-5vh,0) rotate(0)}50%{transform:translate3d(var(--x),55vh,0) rotate(180deg)}100%{transform:translate3d(calc(var(--x)*-.6),110vh,0) rotate(360deg)}}
.burst{position:fixed;z-index:50;pointer-events:none;width:10px;height:13px;background:linear-gradient(135deg,#ffd5de,#e98aa6);border-radius:70% 0 70% 0;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--bx),var(--by)) rotate(var(--br));opacity:0}}

/* ===== Layout ===== */
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:28px 18px 56px;display:flex;flex-direction:column;gap:26px}
.card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-line);border-radius:30px;box-shadow:var(--shadow);padding:22px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:20px}
.js .card{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.js .card.in{opacity:1;transform:none}

.poster{display:block;width:100%;max-width:470px;height:auto;border-radius:20px;box-shadow:0 14px 34px -14px rgba(60,20,30,.5);transition:transform .35s ease}
.poster:hover{transform:scale(1.015)}
.avatar{position:relative;width:min(64vw,290px);aspect-ratio:1/1;border-radius:50%;padding:7px;background:linear-gradient(140deg,#fff,#f6c9d4 55%,#bcdcc4);box-shadow:0 16px 36px -14px rgba(44,70,54,.55);transition:transform .25s ease-out;transform-style:preserve-3d}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px dashed rgba(184,50,90,.35);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Buttons ===== */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:430px;padding:16px 24px;border-radius:999px;text-decoration:none;color:#fff;font-weight:800;font-size:1.05rem;line-height:1.3;text-align:center;background:linear-gradient(135deg,var(--rose) 0%,var(--rose-deep) 100%);box-shadow:0 12px 26px -10px rgba(140,31,67,.7),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s ease,box-shadow .2s ease}
.btn svg{flex:none;width:22px;height:22px}
.btn::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .7s ease}
.btn:hover::before,.btn:focus-visible::before{left:130%}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 30px -10px rgba(140,31,67,.75),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--rose)}
.btn.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 12px 26px -10px rgba(140,31,67,.7),0 0 0 0 rgba(184,50,90,.45)}50%{box-shadow:0 12px 26px -10px rgba(140,31,67,.7),0 0 0 12px rgba(184,50,90,0)}}

footer{position:relative;z-index:2;text-align:center;padding:0 20px 44px;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:1.15rem;color:#fff;text-shadow:0 2px 12px rgba(30,60,40,.6)}
footer span{display:inline-block;background:rgba(44,70,54,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}

@media (max-width:420px){.btn{font-size:1rem;padding:15px 18px}.card{padding:18px 14px 22px;border-radius:26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .card{opacity:1;transform:none}.petals{display:none}}
</style>
</head>

<script>
(function(){
  document.documentElement.classList.add('js');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Reveal cards on scroll
  var cards=document.querySelectorAll('.card');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
    cards.forEach(function(c){io.observe(c)});
  } else {cards.forEach(function(c){c.classList.add('in')})}

  // Falling petals
  var box=document.getElementById('petals');
  if(!reduce){
    for(var i=0;i<14;i++){
      var p=document.createElement('span');p.className='petal';
      p.style.left=(Math.random()*100)+'%';
      p.style.setProperty('--s',(9+Math.random()*9)+'px');
      p.style.setProperty('--d',(14+Math.random()*14)+'s');
      p.style.setProperty('--dl',(-Math.random()*24)+'s');
      p.style.setProperty('--x',((Math.random()*120)-60)+'px');
      box.appendChild(p);
    }
  }

  // Landscape parallax on scroll
  var layers=document.querySelectorAll('.layer');
  var ticking=false;
  function par(){
    var y=window.scrollY;
    layers.forEach(function(l){l.style.transform='translateY('+(y*parseFloat(l.dataset.speed)*-1)+'px)'});
    ticking=false;
  }
  if(!reduce){window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(par)}},{passive:true});}

  // Gentle tilt on profile photos
  document.querySelectorAll('[data-tilt]').forEach(function(el){
    if(reduce)return;
    el.addEventListener('pointermove',function(e){
      var r=el.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      el.style.transform='perspective(600px) rotateY('+(x*14)+'deg) rotateX('+(-y*14)+'deg) scale(1.03)';
    });
    el.addEventListener('pointerleave',function(){el.style.transform=''});
  });

  // Petal burst on tap/click
  document.addEventListener('pointerdown',function(e){
    if(reduce)return;
    for(var i=0;i<7;i++){
      var b=document.createElement('span');b.className='burst';
      b.style.left=e.clientX+'px';b.style.top=e.clientY+'px';
      var a=Math.random()*Math.PI*2,d=30+Math.random()*50;
      b.style.setProperty('--bx',Math.cos(a)*d+'px');
      b.style.setProperty('--by',(Math.sin(a)*d-10)+'px');
      b.style.setProperty('--br',(Math.random()*360)+'deg');
      document.body.appendChild(b);
      setTimeout(function(n){return function(){n.remove()}}(b),950);
    }
  });
})();
</script>
